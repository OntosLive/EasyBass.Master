<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{{ page.title }} · ONTOS.DEEP</title>
  <link rel="stylesheet" href="{{ site.baseurl }}/styles.css">\n  <link rel="stylesheet" href="{{ site.baseurl }}/assets/visual/scene.css">
</head>
<body class="new-master legacy-issue">
  <div class="rule"></div>
  <div class="meta">
    <span>{{ page.date_label }}</span>
    <span>№ {{ page.number }}</span>
  </div>

  <header class="mast">
    <div class="mastline">
      <h1><a href="{{ site.baseurl }}/" style="text-decoration:none">ONTOS<span>.</span>DEEP</a></h1>
      <small>глубокий регистр<br>возбуждение · форма · звук</small>
    </div>
  </header>

  <main class="issue-body">
    {{ content }}

    <div class="signature">
      <div class="name">EasyBassMaster</div>
      <div class="small"><a href="{{ site.baseurl }}/archive/">← подшивка</a></div>
    </div>
  </main>

  <footer>
    <span>ONTOS.DEEP</span>
    <span>EasyBassMaster · Москва</span>
  </footer>
</body>
</html>
