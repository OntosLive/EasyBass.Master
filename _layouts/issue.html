<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{{ page.title }} · EasyBassMaster</title>
  <link rel="stylesheet" href="{{ site.baseurl }}/styles.css">
</head>
<body>
  <div class="topline"></div>
  <div class="meta">
    <span>{{ page.date_label }}</span>
    <span>{{ page.edition }}</span>
    <span>№ {{ page.number }}</span>
  </div>

  <p class="workshop">Москва · частная контрабасная мастерская</p>

  <section class="hero-grid">
    <h1 class="hero-title"><a href="{{ site.baseurl }}/" style="text-decoration:none">КОНТРАБАС</a></h1>
    <div class="hero-side">
      <span>EasyBassMaster</span>
      <span>Москва</span>
      <span>№ {{ page.number }}</span>
    </div>
  </section>

  <main>
    <article class="issue-body">
      {{ content }}
    </article>

    <div class="signature">
      <div class="name">EasyBassMaster</div>
      <div class="small"><a href="{{ site.baseurl }}/archive/">← подшивка объявлений</a></div>
    </div>
  </main>

  <footer>
    <span>Частная контрабасная мастерская</span>
    <span>Сигнал остаётся в эфире.</span>
  </footer>
</body>
</html>
