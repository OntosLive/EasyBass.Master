<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{{ page.title }} · EasyBassMaster</title>
  <link rel="stylesheet" href="{{ site.baseurl }}/styles.css">
</head>
<body>
  <div class="rule"></div>
  <div class="meta">
    <span>{{ page.date_label }}</span>
    <span>№ {{ page.number }}</span>
  </div>

  <section class="hero">
    <h1><a href="{{ site.baseurl }}/" style="text-decoration:none">КОНТРАБАС<span>.</span></a></h1>
  </section>

  <main class="issue-body">
    {{ content }}
    <div class="signature">EasyBassMaster</div>
    <div class="archive-link"><a href="{{ site.baseurl }}/archive/">← Подшивка</a></div>
  </main>

  <footer>
    <span>EasyBassMaster</span>
    <span>Москва</span>
  </footer>
</body>
</html>
