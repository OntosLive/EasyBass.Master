<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{{ page.title }} · EASY.BASS master</title>
  <link rel="stylesheet" href="{{ site.baseurl }}/styles.css">
</head>
<body>
  <header class="masthead">
    <div class="rule"></div>
    <div class="meta">
      <span>{{ page.date_label | default: "28 СЕНТЯБРЯ 2026" }}</span>
      <span>{{ page.edition | default: "ВЫПУСК" }}</span>
      <span>№ {{ page.number }}</span>
    </div>
    <a class="brand-link" href="{{ site.baseurl }}/"><div class="brand-lockup"><div class="brand-main">EASY<span>.</span>BASS</div><div class="brand-sub">master</div></div></a>
    <p class="tagline">Контрабасы · мастерская · прокат · продажа · Москва</p>
    <div class="rule heavy"></div>
  </header>

  <main>
    <article class="lead issue-body">
      {{ content }}
    </article>

    <p style="margin:40px 0 0;font:700 11px Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase">
      <a href="{{ site.baseurl }}/archive/" style="color:inherit">← Подшивка EASYBASS.MASTER</a>
    </p>
  </main>

  <footer>
    <span>EASYBASS.MASTER · № {{ page.number }}</span>
    <span>Сигнал остаётся в эфире.</span>
  </footer>
</body>
</html>
