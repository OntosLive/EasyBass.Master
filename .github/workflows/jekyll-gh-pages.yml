name: Build and validate EasyBassMaster
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements-site.txt
      - name: Check inventory and editorial graph
        run: python scripts/link_audit.py --report _audit/links.json
      - name: Audit full research atlas and model sources
        run: python scripts/atlas_core.py --output _audit/atlas.json
      - name: Check purchase/sale editorial tone
        run: python scripts/tone_audit.py --output _audit/tone.json
      - name: Audit individually written GPT-6 modulations and legacy backlog
        run: python scripts/modulation_audit.py --complete --output _audit/modulations.json
      - name: Compile-check and run regression tests
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v
      - uses: actions/configure-pages@v5
      - name: Render legacy issues and institution with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Restore permissions after containerized Jekyll build
        run: sudo chown -R "$(id -u):$(id -g)" _site
      - name: Compile canonical subject pages and archive
        run: python scripts/site_core.py --site _site --report _audit/build.json
      - name: Validate complete public artifact
        run: python scripts/validate_site.py --site _site --output _audit/validation.json
      - name: Check real browser layout at 390 and 1366 pixels
        run: python scripts/visual_smoke.py --site _site --output _audit/screens
      - name: Publish isolated, noindex room preview
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin codex/room-foyer-integration-20261011
          mkdir -p _site/preview-room/assets/photography
          git show FETCH_HEAD:index.html > _site/preview-room/index.html
          for photo in room-golden.webp row-amber.webp room-evening.webp; do
            git show "FETCH_HEAD:assets/photography/$photo" > "_site/preview-room/assets/photography/$photo"
          done
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          page = Path('_site/preview-room/index.html')
          html = page.read_text(encoding='utf-8')
          if html.count('Пространство, в котором можно найти свой.') < 1:
              raise SystemExit('Room preview: approved heading is missing')
          html = html.replace('</head>', '<meta name="robots" content="noindex,nofollow">\\n</head>', 1)
          html = html.replace('href="archive/"', 'href="../archive/"')
          html = html.replace('<title>Мастерская контрабаса · EasyBassMaster</title>',
                              '<title>Предпросмотр комнаты · EasyBassMaster</title>', 1)
          page.write_text(html, encoding='utf-8')
          doc = BeautifulSoup(html, 'html.parser')
          cta = doc.select('.cards-3 .info-card:last-child > a.btn[href="#contact"]')
          if len(cta) != 1 or cta[0].get_text(' ', strip=True) != 'Договориться о встрече':
              raise SystemExit('Preview CTA nesting is invalid')
          for img in doc.select('img[src]'):
              src = img['src']
              if not src:  # Runtime lightbox starts empty until a thumbnail is opened.
                  continue
              if not (page.parent / src).is_file():
                  raise SystemExit(f'Room preview missing image: {src}')
          if len(doc.select('meta[name="robots"][content="noindex,nofollow"]')) != 1:
              raise SystemExit('Room preview must not be indexed')
          print('Isolated room preview ready at /preview-room/')
          PY
      - name: Publish standalone foyer and test it in a real browser
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin codex/room-foyer-integration-20261011
          mkdir -p _site/preview-foyer/assets/photography
          git show FETCH_HEAD:design/foyer/index.html > _site/preview-foyer/index.html
          git show FETCH_HEAD:assets/photography/room-golden.webp > _site/preview-foyer/assets/photography/room-golden.webp
          python - <<'PY'
          import asyncio
          from pathlib import Path
          import shutil
          from bs4 import BeautifulSoup
          from playwright.async_api import async_playwright

          site = Path('_site').resolve()
          entry = site / 'preview-foyer/index.html'
          html = entry.read_text(encoding='utf-8')
          doc = BeautifulSoup(html, 'html.parser')
          assert len(doc.select('h1')) == 1, 'Foyer must have one H1'
          assert 'Прихожая' in doc.title.text, 'Foyer is not a distinct document'
          assert not doc.select_one('h1').get_text(' ', strip=True).startswith('Пространство, в котором'), 'Copied room instead of foyer'
          assert len(doc.select('a.primary[href="../preview-room/"]')) == 1, 'Main door does not lead to room'
          assert doc.select_one('meta[name="robots"][content="noindex,nofollow"]'), 'Preview must not index'
          for img in doc.select('img[src]'):
              assert (entry.parent / img['src']).is_file(), f"Missing preview photograph: {img['src']}"
          for a in doc.select('a[href]'):
              if a['href'].startswith('../preview-room/'):
                  assert (site / 'preview-room/index.html').exists(), 'Room destination unavailable'

          async def browser_check():
              chrome = shutil.which('google-chrome') or shutil.which('chromium')
              if not chrome:
                  raise RuntimeError('Browser executable missing')
              async with async_playwright() as p:
                  browser = await p.chromium.launch(executable_path=chrome, headless=True, args=['--no-sandbox', '--allow-file-access-from-files'])
                  try:
                      for width in (390, 728, 1366):
                          page = await browser.new_page(viewport={'width': width, 'height': 900}, device_scale_factor=1)
                          await page.goto(entry.as_uri(), wait_until='load')
                          await page.wait_for_function("() => document.querySelector('.door-photo').naturalWidth > 0")
                          data = await page.evaluate("""() => {
                            const rect = selector => document.querySelector(selector).getBoundingClientRect();
                            const button = rect('.primary'), photo = rect('.door-surround'), title = rect('h1');
                            return {overflow: document.documentElement.scrollWidth - document.documentElement.clientWidth,
                                    buttonWidth: button.width, buttonRight: button.right,
                                    photoWidth: photo.width, titleWidth: title.width,
                                    h1: document.querySelector('h1').textContent.trim()};
                          }""")
                          assert data['overflow'] <= 1, f'Foyer horizontal overflow {width}px: {data}'
                          assert 170 < data['buttonWidth'] <= width, f'Foyer CTA collapsed {width}px: {data}'
                          assert 200 < data['photoWidth'] <= width, f'Foyer doorway collapsed {width}px: {data}'
                          assert 200 < data['titleWidth'] <= width, f'Foyer heading broken {width}px: {data}'
                          await page.screenshot(path=str(Path('_audit') / f'foyer-{width}.png'), full_page=True, animations='disabled')
                          await page.locator('a.primary').click()
                          assert '/preview-room/' in page.url, 'Door opens wrong document'
                          print(f'FOYER_OK {width}px {data}')
                          await page.close()
                  finally:
                      await browser.close()

          asyncio.run(browser_check())
          PY
      - name: Save diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: easybass-audit
          path: _audit/
          retention-days: 14
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy validated site
        id: deployment
        uses: actions/deploy-pages@v5
