<title id="t">ВНУТРЕННЯЯ КОНСТРУКЦИЯ</title><desc id="d">Схема внутренней поверхности верхней деки контрабаса, с пометками: верхний и нижний клецы, басовая балка под басовой ножкой подставки, душка у дискантовой ножки, контробечайки и угловые блоки. Дополнительное схематическое сечение демонстрирует душку между верхней и нижней деками.</desc>
